name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      - name: Verify deploy artifacts
        run: |
          for f in out/index.html out/404.html out/sitemap.xml out/robots.txt out/_headers; do
            test -s "$f" || { echo "Missing build artifact: $f"; exit 1; }
          done

      - name: Report unresolved placeholders (informational until launch)
        run: npm run check:placeholders
        continue-on-error: true

  # Accessibility scan (Playwright + axe) of the built site. Informational for now: it is NOT a required
  # check in the "Protect main" ruleset, so a red result does not block merge. Make it required after
  # 5 consecutive clean runs (see README). No `paths:` filter and no `if:`: a skipped required check
  # would block merging, so this job must always run.
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility scan
        run: npm run test:a11y

      - name: Upload Playwright report (failures only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
